name: LATCH CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: latch-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Install backend dependencies
        run: |
          if ! composer install --no-interaction --prefer-dist --no-progress >composer-install.log 2>&1; then
            cat composer-install.log
            message="$(tail -n 30 composer-install.log | tr '\n' ' ')"
            echo "::error file=.github/workflows/ci.yml,line=25::$message"
            exit 1
          fi
      - name: Configure test application
        run: php artisan key:generate
      - name: Validate formatting
        run: vendor/bin/pint --test
      - name: Run backend tests
        run: php artisan test

  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Install packages
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Compile Android debug artifact
        run: flutter build apk --debug

  ios:
    name: iOS simulator build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.7
          cache: true
      - name: Enable Flutter Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - name: Install packages
        run: |
          if ! flutter pub get >flutter-pub-get.log 2>&1; then
            cat flutter-pub-get.log
            message="$(tail -n 30 flutter-pub-get.log | tr '\n' ' ')"
            echo "::error file=.github/workflows/ci.yml,line=68::$message"
            exit 1
          fi
      - name: Compile iOS simulator artifact
        run: flutter build ios --simulator --debug
      - name: Compile unsigned iOS release artifact
        run: flutter build ios --release --no-codesign
